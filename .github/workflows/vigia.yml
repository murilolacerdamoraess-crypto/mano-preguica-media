name: vigia
on:
  schedule:
    - cron: '7,37 * * * *'   # a cada ~30min (minutos 7 e 37 pra fugir do pico dos crons)
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'modo seco (1 = nao manda Telegram, so imprime)'
        default: '0'
permissions:
  contents: write
concurrency:
  group: vigia
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: rodar vigia
        env:
          DRY_RUN: ${{ inputs.dry_run || '0' }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/vigia.py
      - name: salvar estado
        run: |
          git config user.name "vigia-bot"
          git config user.email "bot@users.noreply.github.com"
          git pull --rebase || true
          git add vigia_state.json || true
          git commit -m "vigia: estado atualizado [skip ci]" || echo "sem mudanca"
          git push || echo "push skip"
