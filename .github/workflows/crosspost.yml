name: crosspost
on:
  # 09/08/2026: PostProxy rebaixado pro plano GRATIS. TikTok SAIU daqui (postava NAO-publico ->
  # perdia monetizacao + desativava comentario) e voltou pro Metricool (agendado via MCP em sessao).
  # Aqui ficam so IG + FB (gratis, presenca). DAILY_TT=0 corta o TikTok. Repost automatico tambem off.
  schedule:
    - cron: '0 12 * * *'   # DIARIO 12h UTC = 9h BRT (so dispara; publica a noite)
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'modo seco (1 = nao posta, so lista)'
        default: '1'
      only_video:
        description: 'override manual: postar SO este video id (ex.: tRjp62LVJ3M)'
        default: ''
      only_net:
        description: 'override manual: nesta rede (tiktok|instagram|facebook)'
        default: ''
      schedule_at:
        description: 'agendar p/ ISO8601 UTC (ex.: 2026-07-18T00:00:00Z). vazio = agora'
        default: ''
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: instalar ferramentas
        run: |
          python -m pip install -U yt-dlp >/dev/null
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: rodar robo
        env:
          DRY_RUN: ${{ inputs.dry_run || '0' }}
          ONLY_VIDEO: ${{ inputs.only_video || '' }}
          ONLY_NET: ${{ inputs.only_net || '' }}
          SCHEDULE_AT: ${{ inputs.schedule_at || '' }}
          POSTPROXY_KEY: ${{ secrets.POSTPROXY_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TMP_DIR: /tmp/xp
          START_DATE: '2026-07-15'
          # Build = 120 posts/mês TOTAL (compartilhado c/ Surtei, TCG, etc.).
          # Mano Preguiça usa 3/dia (FB1+TT1+IG1) = ~90/mês; teto 93 reserva ~27/mês pros outros projetos.
          MONTH_CAP: '93'
          # 12/09/2026: assinatura do PostProxy CANCELADA (decisão do Murilo, nao paga mais
          # assinatura). A API inteira responde 403, entao IG e FB via PostProxy morreram: as
          # cotas vao a ZERO pra o robo parar de tentar e de disparar alerta falso no Telegram.
          # IG/FB voltam pela Graph API oficial (gratis, OAuth ja conectado no painel).
          # TikTok segue no Metricool gratis (20 posts/mes), como desde 09/08.
          DAILY_FB: '0'
          FB_WEEKDAY: '2'
          DAILY_TT: '0'
          DAILY_IG: '0'
          # Deixa o Metricool escoar os pendentes; PostProxy assume no dia seguinte ao último de cada rede.
          TT_START: '2026-08-02'   # último TikTok do Metricool = 01/08
          IG_START: '2026-08-17'   # último IG do Metricool = 16/08
        run: python scripts/crosspost.py
      - name: checar saude da distribuicao (PostProxy + Metricool)
        env:
          DRY_RUN: ${{ inputs.dry_run || '0' }}
          POSTPROXY_KEY: ${{ secrets.POSTPROXY_KEY }}
          METRICOOL_TOKEN: ${{ secrets.METRICOOL_TOKEN }}
          METRICOOL_BLOG_ID: '6553996'
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/checar_saude.py || echo "saude skip"
      - name: publicar programacao (o que vai sair, por rede)
        env:
          START_DATE: '2026-07-15'
          MONTH_CAP: '93'
          DAILY_FB: '0'
          FB_WEEKDAY: '2'
          DAILY_TT: '0'
          DAILY_IG: '0'
          TT_START: '2026-08-02'
          IG_START: '2026-08-17'
          TMP_DIR: /tmp/xp
        run: python scripts/programacao_json.py || echo "programacao skip"
      - name: coletar metricas reais (PostProxy)
        env:
          POSTPROXY_KEY: ${{ secrets.POSTPROXY_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/metrics.py || echo "metrics skip"
      - name: gerar painel (Canal Agente)
        run: python scripts/dashboard.py || echo "dashboard skip"
      - name: salvar ledger atualizado
        run: |
          git config user.name "crosspost-bot"
          git config user.email "bot@users.noreply.github.com"
          git add ledger.json schedule.json metrics.json programacao.json saude_state.json dashboard/ || true
          git commit -m "ledger+metrics+painel: atualizado pelo robo [skip ci]" || echo "sem mudanca"
          git push || echo "push skip"
