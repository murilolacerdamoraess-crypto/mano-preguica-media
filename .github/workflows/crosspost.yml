name: crosspost
on:
  schedule:
    # Roda de DIA (12h UTC = 9h BRT) e AGENDA os posts do dia p/ a noite BRT via scheduled_at.
    # Assim o horário é cravado (FB 20h/22h, TikTok 21h, IG 21h30), mesmo o cron do GitHub atrasando.
    - cron: '0 12 * * *'   # DIÁRIO 12h UTC = 9h BRT (só dispara; publica à noite)
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'modo seco (1 = nao posta, so lista)'
        default: '1'
      only_video:
        description: 'override manual: postar SO este video id (ex.: tRjp62LVJ3M)'
        default: ''
      only_net:
        description: 'override manual: nesta rede (tiktok|instagram|facebook)'
        default: ''
      schedule_at:
        description: 'agendar p/ ISO8601 UTC (ex.: 2026-07-18T00:00:00Z). vazio = agora'
        default: ''
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: instalar ferramentas
        run: |
          python -m pip install -U yt-dlp >/dev/null
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: rodar robo
        env:
          DRY_RUN: ${{ inputs.dry_run || '0' }}
          ONLY_VIDEO: ${{ inputs.only_video || '' }}
          ONLY_NET: ${{ inputs.only_net || '' }}
          SCHEDULE_AT: ${{ inputs.schedule_at || '' }}
          POSTPROXY_KEY: ${{ secrets.POSTPROXY_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TMP_DIR: /tmp/xp
          START_DATE: '2026-07-15'
          # Build = 120 posts/mês TOTAL (compartilhado c/ Surtei, TCG, etc.).
          # Mano Preguiça usa 3/dia (FB1+TT1+IG1) = ~90/mês; teto 93 reserva ~27/mês pros outros projetos.
          MONTH_CAP: '93'
          DAILY_FB: '0'      # CORTADO (08/08): FB não constrói renda e tinha ~280 impressões/post.
          # A cota (~30/mês) fica guardada pros outros projetos (Surtei/TCG) no plano Build compartilhado.
          # O código do FB (queue_facebook + Reel condicional) segue pronto — é só voltar pra 1 pra religar.
          DAILY_TT: '1'
          DAILY_IG: '1'
          # Deixa o Metricool escoar os pendentes; PostProxy assume no dia seguinte ao último de cada rede.
          TT_START: '2026-08-02'   # último TikTok do Metricool = 01/08
          IG_START: '2026-08-17'   # último IG do Metricool = 16/08
        run: python scripts/crosspost.py
      - name: coletar metricas reais (PostProxy)
        env:
          POSTPROXY_KEY: ${{ secrets.POSTPROXY_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/metrics.py || echo "metrics skip"
      - name: salvar ledger atualizado
        run: |
          git config user.name "crosspost-bot"
          git config user.email "bot@users.noreply.github.com"
          git add ledger.json schedule.json metrics.json || true
          git commit -m "ledger+metrics: atualizado pelo robo [skip ci]" || echo "sem mudanca"
          git push || echo "push skip"
